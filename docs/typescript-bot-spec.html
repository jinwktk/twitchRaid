<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=index.html" />
    <link rel="canonical" href="index.html" />
    <title>統合仕様書へ移動します</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --paper: #ffffff;
        --ink: #17202a;
        --muted: #596579;
        --line: #dbe3ee;
        --bot: #0f8b8d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        line-height: 1.65;
      }

      main {
        width: min(680px, calc(100% - 32px));
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        padding: 28px;
        box-shadow: 0 10px 28px rgba(35, 44, 65, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        line-height: 1.25;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
      }

      a {
        color: var(--bot);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TypeScript版仕様書は統合されました</h1>
      <p>
        仕様書を二重管理しないため、このページの内容は
        <a href="index.html">twitchRaid Bot しくみ図鑑</a> へ統合しました。
        自動で移動しない場合はリンクを開いてください。
      </p>
    </main>
  </body>
</html>
