name: Auto Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/clip-search-data.json"

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        run: |
          cd E:\GitHub\twitchRaid
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd E:\GitHub\twitchRaid
          npm install --ignore-scripts
          node node_modules/esbuild/install.js 2>$null; $true

      - name: Build
        run: |
          cd E:\GitHub\twitchRaid
          npx tsc

      - name: Restart pm2
        run: |
          pm2 restart twitchRaid
