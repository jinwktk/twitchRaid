name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        run: |
          cd E:\GitHub\twitchRaid
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd E:\GitHub\twitchRaid
          npm install

      - name: Build
        run: |
          cd E:\GitHub\twitchRaid
          npx tsc

      - name: Restart pm2
        run: |
          pm2 restart twitchRaid