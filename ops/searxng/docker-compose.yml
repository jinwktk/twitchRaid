services:
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - /home/mlove/dokploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      dokploy-network:
        aliases:
          - searxng
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback

networks:
  dokploy-network:
    external: true
