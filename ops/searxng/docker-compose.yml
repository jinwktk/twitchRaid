services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8899:8080"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
