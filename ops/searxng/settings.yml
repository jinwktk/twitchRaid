use_default_settings:
  engines:
    keep_only:
      - bing
      - yahoo japan

general:
  debug: false
  instance_name: twitchRaid SearXNG

search:
  safe_search: 1
  default_lang: ja-JP
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: change-this-before-public-use
  limiter: false
  public_instance: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  keepalive_expiry: 300.0

engines:
  - name: bing
    disabled: false
    shortcut: bi
    timeout: 3.0
  - name: yahoo japan
    engine: xpath
    disabled: false
    shortcut: yjp
    categories: general
    paging: false
    search_url: https://search.yahoo.co.jp/search?p={query}
    results_xpath: '//div[contains(concat(" ", normalize-space(@class), " "), " Algo ")]'
    url_xpath: './/div[contains(@class, "sw-Card__title")]//a[1]/@href'
    title_xpath: './/h3[contains(@class, "sw-Card__titleMain")]'
    content_xpath: './/p[contains(@class, "sw-Card__summary")]'
    timeout: 3.0
    headers:
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36
      Accept-Language: ja-JP,ja;q=0.9
