use_default_settings:
  engines:
    keep_only:
      - google

general:
  debug: false
  instance_name: twitchRaid SearXNG

search:
  safe_search: 1
  default_lang: ja-JP
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: change-this-before-public-use
  limiter: false
  public_instance: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0

engines:
  - name: google
    disabled: false
    shortcut: go
    timeout: 8.0
