services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_FLASH_ATTENTION: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/ollama:/root/.ollama
    ports:
      - target: 11434
        published: 11434
        protocol: tcp
        mode: ingress
    networks:
      - dokploy-network
    deploy:
      restart_policy:
        condition: any

  whisper-api:
    image: localhost:5050/sub-whisper-api:local
    environment:
      WHISPER_MODEL: kotoba-tech/kotoba-whisper-v2.0-faster
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: int8
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/huggingface:/root/.cache/huggingface
    ports:
      - target: 5001
        published: 8888
        protocol: tcp
        mode: ingress
    networks:
      - dokploy-network
    deploy:
      restart_policy:
        condition: any

  sbvits2:
    image: localhost:5050/sub-sbvits2:local
    working_dir: /app
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      TZ: Asia/Tokyo
    volumes:
      - /opt/sub-ai/sbvits2:/app
      - /home/mlove/dokploy/huggingface:/root/.cache/huggingface
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: ingress
    networks:
      - dokploy-network
    deploy:
      restart_policy:
        condition: any

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - /home/mlove/dokploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      dokploy-network:
        aliases:
          - searxng
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback

  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/mem0/qdrant:/qdrant/storage
    networks:
      dokploy-network:
        aliases:
          - qdrant
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
        failure_action: rollback

  mem0:
    image: localhost:5050/twitchraid-mem0-oss:local
    environment:
      MEM0_ADMIN_API_KEY: ${MEM0_ADMIN_API_KEY}
      MEM0_QDRANT_HOST: qdrant
      MEM0_QDRANT_PORT: "6333"
      MEM0_COLLECTION_NAME: twitchraid_memories
      MEM0_EMBEDDING_DIMS: "768"
      MEM0_OLLAMA_BASE_URL: http://sub-ai_ollama:11434
      MEM0_LLM_MODEL: gemma4:e4b-it-qat
      MEM0_EMBEDDER_MODEL: nomic-embed-text:latest
      MEM0_INFER_DEFAULT: "false"
      MEM0_HISTORY_DB_PATH: /app/history/history.db
      MEM0_TELEMETRY: "false"
      ANONYMIZED_TELEMETRY: "false"
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/mem0/history:/app/history
    networks:
      dokploy-network:
        aliases:
          - mem0
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback

  anythingllm:
    image: mintplexlabs/anythingllm:1.15.0@sha256:df8a540a06079c42c0835b40002e708bea895b5ab3c631d723c276a378a2857f
    environment:
      NODE_ENV: production
      STORAGE_DIR: /app/server/storage
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: gemma4:e4b-it-qat
      OLLAMA_MODEL_TOKEN_LIMIT: "4096"
      OLLAMA_RESPONSE_TIMEOUT: "180000"
      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://ollama:11434
      EMBEDDING_MODEL_PREF: nomic-embed-text:latest
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "8192"
      VECTOR_DB: qdrant
      QDRANT_ENDPOINT: http://qdrant:6333
      AGENT_SEARXNG_API_URL: http://searxng:8080
      AGENT_MAX_TOOL_CALLS: "5"
      DISABLE_TELEMETRY: "true"
      DISABLE_SWAGGER_DOCS: "true"
      EMBED_REQUIRE_ALLOWLIST: "true"
      ANYTHINGLLM_CHROMIUM_ARGS: --no-sandbox,--disable-setuid-sandbox
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/anythingllm/storage:/app/server/storage
      - /home/mlove/dokploy/anythingllm/.env:/app/server/.env
    networks:
      dokploy-network:
        aliases:
          - anythingllm
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
        failure_action: rollback

networks:
  dokploy-network:
    external: true
