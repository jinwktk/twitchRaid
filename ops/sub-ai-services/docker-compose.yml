services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_FLASH_ATTENTION: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/ollama:/root/.ollama
    ports:
      - target: 11434
        published: 11434
        protocol: tcp
        mode: ingress
    networks:
      - dokploy-network
    deploy:
      restart_policy:
        condition: any

  whisper-api:
    image: localhost:5050/sub-whisper-api:local
    environment:
      WHISPER_MODEL: kotoba-tech/kotoba-whisper-v2.0-faster
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: int8
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/huggingface:/root/.cache/huggingface
    ports:
      - target: 5001
        published: 8888
        protocol: tcp
        mode: ingress
    networks:
      - dokploy-network
    deploy:
      restart_policy:
        condition: any

  sbvits2:
    image: localhost:5050/sub-sbvits2:local
    working_dir: /app
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      TZ: Asia/Tokyo
    volumes:
      - /opt/sub-ai/sbvits2:/app
      - /home/mlove/dokploy/huggingface:/root/.cache/huggingface
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: ingress
    networks:
      - dokploy-network
    deploy:
      restart_policy:
        condition: any

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - /home/mlove/dokploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      dokploy-network:
        aliases:
          - searxng
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback

  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/mem0/qdrant:/qdrant/storage
    networks:
      dokploy-network:
        aliases:
          - qdrant
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
        failure_action: rollback

  anythingllm:
    image: localhost:5050/twitchraid-anythingllm:1.15.0-no-thinking-v1
    environment:
      NODE_ENV: production
      STORAGE_DIR: /app/server/storage
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: gemma4:e4b-it-qat
      OLLAMA_MODEL_TOKEN_LIMIT: "4096"
      OLLAMA_RESPONSE_TIMEOUT: "180000"
      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://ollama:11434
      EMBEDDING_MODEL_PREF: nomic-embed-text:latest
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "8192"
      VECTOR_DB: qdrant
      QDRANT_ENDPOINT: http://qdrant:6333
      AGENT_SEARXNG_API_URL: http://searxng:8080
      AGENT_MAX_TOOL_CALLS: "5"
      DISABLE_TELEMETRY: "true"
      DISABLE_SWAGGER_DOCS: "true"
      EMBED_REQUIRE_ALLOWLIST: "true"
      ANYTHINGLLM_CHROMIUM_ARGS: --no-sandbox,--disable-setuid-sandbox
      TZ: Asia/Tokyo
    volumes:
      - /home/mlove/dokploy/anythingllm/storage:/app/server/storage
      - /home/mlove/dokploy/anythingllm/.env:/app/server/.env
    ports:
      - target: 3001
        published: 3220
        protocol: tcp
        mode: host
    networks:
      dokploy-network:
        aliases:
          - anythingllm
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
        failure_action: rollback

  memory-web:
    image: ${TWITCHRAID_BOT_IMAGE:-localhost:5050/twitch-raid-apcz9n:local}
    command:
      - node
      - scripts/anythingllm-memory-web.mjs
      - --host
      - 0.0.0.0
      - --port
      - "3221"
      - --allow-lan
    volumes:
      - ${TWITCHRAID_DATA_DIR:-/mnt/e/GitHub/twitchRaid/data}:/app/data:ro
    ports:
      - target: 3221
        published: 3221
        protocol: tcp
        mode: host
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
        failure_action: rollback

networks:
  dokploy-network:
    external: true
